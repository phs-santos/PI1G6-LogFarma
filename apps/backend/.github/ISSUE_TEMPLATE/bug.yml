name: Bug
description: Algo não funciona como deveria
labels: ["bug"]
body:
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abra a tela…
        2. Clique em…
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: obtido
    attributes:
      label: O que aconteceu
      description: Mensagens de erro, prints. Não cole dados reais de pacientes (LGPD).
    validations:
      required: true
