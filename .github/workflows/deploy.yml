name: Deploy

# Manual: Actions → Deploy → Run workflow.
on:
  workflow_dispatch:
    inputs:
      backend_tag:
        description: Tag da imagem do backend (latest ou sha curto do commit)
        default: latest
        required: true
      frontend_tag:
        description: Tag da imagem do frontend (latest ou sha curto do commit)
        default: latest
        required: true

permissions:
  contents: read
  packages: read

# Nunca dois deploys ao mesmo tempo.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          BACKEND_TAG: ${{ inputs.backend_tag }}
          FRONTEND_TAG: ${{ inputs.frontend_tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./infra/scripts/deploy.sh
