name: Funcionalidade / requisito
description: Trabalho ligado a um requisito do PI (RF01–RF08) ou uma melhoria
labels: ["requisito"]
body:
  - type: dropdown
    id: requisito
    attributes:
      label: Requisito
      options:
        - RF01 — Consultar estoque local
        - RF02 — Consultar disponibilidade na rede
        - RF03 — Unidade mais próxima e rota
        - RF04 — Pedido de compra ao fornecedor
        - RF05 — Notificar paciente
        - RF06 — Lista de espera com alerta
        - RF07 — Transferência entre unidades
        - RF08 — Entrega no domicílio
        - Nenhum (melhoria geral)
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: O que precisa ser feito
      description: Descreva do ponto de vista de quem usa (paciente, farmacêutico, unidade…).
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] Mostra o estoque da unidade em menos de 10 s (RNF01)
        - [ ] Trata carregamento, erro e lista vazia
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Depende de
      description: Issues em outros repositórios (ordem style-guide → backend → frontend).
