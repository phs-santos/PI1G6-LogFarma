# Produção (VPS). Usa as imagens publicadas pelos workflows imagem-backend/imagem-frontend do monorepo.
# Fica em ~/grupo-pi-6 na VPS junto com o .env (copiado de .env.prod.example e preenchido lá).
# Quem sobe isso é o scripts/deploy.sh; não é preciso clonar nada na VPS.

name: pi

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina no .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Sem "ports": o banco só é acessível pela rede interna do compose.

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/phs-santos/pi1g6-logfarma}/backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: ${PUBLIC_URL:?defina no .env}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?defina no .env}
      # true só quando houver HTTPS na frente (ver Pendências no infra/README.md)
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/phs-santos/pi1g6-logfarma}/frontend:${FRONTEND_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
