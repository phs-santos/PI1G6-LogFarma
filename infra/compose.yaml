# Ambiente de desenvolvimento: banco + backend + frontend com hot reload.
# Tudo vem deste monorepo (apps/backend, apps/frontend, packages/style-guide).
# Uso (na raiz):  pnpm docker:dev   ou   docker compose --env-file .env -f infra/compose.yaml up --build
# As variáveis ${...} vêm do .env da raiz (opcional: sem ele valem os padrões abaixo).

name: pi-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi}
      POSTGRES_DB: ${POSTGRES_DB:-pi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
      target: dev
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://${POSTGRES_USER:-pi}:${POSTGRES_PASSWORD:-pi}@db:5432/${POSTGRES_DB:-pi}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque}
      COOKIE_SECURE: "false"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      # E-mail (recuperar senha) por SMTP; vazio = não envia (ver .env.example)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "3333:3333"
    volumes:
      - ../apps/backend:/app/apps/backend
      - /app/apps/backend/node_modules # mantém o node_modules da imagem (Linux), não o do seu computador
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      target: dev
    environment:
      API_PROXY_TARGET: http://backend:3333
    ports:
      - "5173:5173"
    volumes:
      - ../apps/frontend:/app/apps/frontend
      - /app/apps/frontend/node_modules
      # style-guide montado também: editar um componente recarrega a tela na hora
      - ../packages/style-guide:/app/packages/style-guide
      - /app/packages/style-guide/node_modules
    depends_on:
      - backend

  # Interface web para olhar o banco: docker compose --profile ferramentas up adminer
  adminer:
    image: adminer:4
    profiles: ["ferramentas"]
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
