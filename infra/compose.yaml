# Ambiente de desenvolvimento: banco + backend + frontend com hot reload.
# Espera os repos clonados lado a lado:  ../backend  ../frontend  (scripts/setup-dev.sh faz isso)
# Uso: docker compose up --build

name: pi-dev

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pi}
      POSTGRES_DB: ${POSTGRES_DB:-pi}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      target: dev
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgres://${POSTGRES_USER:-pi}:${POSTGRES_PASSWORD:-pi}@db:5432/${POSTGRES_DB:-pi}
    ports:
      - "3333:3333"
    volumes:
      - ../backend:/app
      - /app/node_modules # mantém o node_modules da imagem (Linux), não o do seu computador
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      target: dev
      # O style-guide é privado: o build usa sua chave SSH do GitHub.
      # Padrão: o ssh-agent. Sem agent, defina GITHUB_SSH_KEY=~/.ssh/sua-chave no .env.
      ssh:
        - default=${GITHUB_SSH_KEY:-${SSH_AUTH_SOCK}}
    environment:
      API_PROXY_TARGET: http://backend:3333
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Interface web para olhar o banco: docker compose --profile ferramentas up adminer
  adminer:
    image: adminer:4
    profiles: ["ferramentas"]
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  db-data:
